name: Immich load test
run-name: >-
  Immich load test:
  uploads=${{ inputs.concurrent_uploads || '1' }}
  users=${{ inputs.users || '1' }}
  think=${{ inputs.think_time_seconds || '0' }}
  dur=${{ inputs.duration || '30s' }}
  photo=${{ inputs.photo_ratio || '0.5' }}
  size=${{ inputs.size_level || 'small' }}
  res=${{ inputs.resolution || '1080p' }}
  iters=${{ inputs.iterations || 'none' }}
  seed=${{ inputs.fixture_seed || '533' }}

on:
  workflow_dispatch:
    inputs:
      duration:
        description: k6 test duration
        required: true
        default: 30s
        type: string
      concurrent_uploads:
        description: Total uploads in flight (k6 virtual users)
        required: true
        default: "1"
        type: string
      users:
        description: Immich accounts the uploads rotate through
        required: true
        default: "1"
        type: string
      think_time_seconds:
        description: Pause after each upload, in seconds (0 for back-to-back uploads)
        required: true
        default: "0"
        type: string
      photo_ratio:
        description: Fraction of uploads that should be photos
        required: true
        default: "0.5"
        type: string
      size_level:
        description: Fixture size level (photo 0-1/1-10/10-50MB, video 1-10/10-100/100-1000MB)
        required: true
        default: small
        type: choice
        options: [small, medium, large]
      resolution:
        description: Fixture resolution
        required: true
        default: 1080p
        type: choice
        options: [480p, 1080p, 4k]
      iterations:
        description: Total uploads (optional; overrides duration)
        required: false
        default: ""
        type: string
      fixture_seed:
        description: Fixture generator seed
        required: false
        default: "533"
        type: string
      drain_timeout_seconds:
        description: Seconds to wait for background jobs to catch up after k6 exits
        required: false
        default: "1800"
        type: string
  workflow_call:
    inputs:
      duration:
        description: k6 test duration
        required: false
        default: 30s
        type: string
      concurrent_uploads:
        description: Total uploads in flight (k6 virtual users)
        required: false
        default: "1"
        type: string
      users:
        description: Immich accounts the uploads rotate through
        required: false
        default: "1"
        type: string
      think_time_seconds:
        description: Pause after each upload, in seconds (0 for back-to-back uploads)
        required: false
        default: "0"
        type: string
      photo_ratio:
        description: Fraction of uploads that should be photos
        required: false
        default: "0.5"
        type: string
      size_level:
        description: Fixture size level (small, medium, or large)
        required: false
        default: small
        type: string
      resolution:
        description: Fixture resolution (480p, 1080p, or 4k)
        required: false
        default: 1080p
        type: string
      iterations:
        description: Total uploads (optional; overrides duration)
        required: false
        default: ""
        type: string
      fixture_seed:
        description: Fixture generator seed
        required: false
        default: "533"
        type: string
      drain_timeout_seconds:
        description: Seconds to wait for background jobs to catch up after k6 exits
        required: false
        default: "1800"
        type: string

permissions:
  contents: read

env:
  RUN_PARAMS: uploads=${{ inputs.concurrent_uploads || '1' }}_users=${{ inputs.users || '1' }}_think=${{ inputs.think_time_seconds || '0' }}_dur=${{ inputs.duration || '30s' }}_photo=${{ inputs.photo_ratio || '0.5' }}_size=${{ inputs.size_level || 'small' }}_res=${{ inputs.resolution || '1080p' }}_iters=${{ inputs.iterations || 'none' }}_seed=${{ inputs.fixture_seed || '533' }}

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: loadtest
    env:
      SERVER_NAME: immich-server-${{ github.run_id }}
      SIGNAL_PORT: "5000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record run parameters
        run: python3 scripts/record_run_params.py --role server --output results/run-params.json --summary
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: ${{ env.SERVER_NAME }}
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Configure stack
        env:
          DB_PASSWORD: ${{ secrets.IMMICH_DB_PASSWORD }}
        run: |
          cp .env.example .env
          if [ -n "$DB_PASSWORD" ]; then
            sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$DB_PASSWORD/" .env
          fi
      - name: Check server disk
        env:
          SIZE_LEVEL: ${{ inputs.size_level || 'small' }}
          CONCURRENT_UPLOADS: ${{ inputs.concurrent_uploads || '1' }}
          THINK_TIME_SECONDS: ${{ inputs.think_time_seconds || '0' }}
          DURATION: ${{ inputs.duration || '30s' }}
          ITERATIONS: ${{ inputs.iterations }}
          PHOTO_RATIO: ${{ inputs.photo_ratio || '0.5' }}
        run: |
          python3 scripts/preflight.py disk \
            --size-level "$SIZE_LEVEL" \
            --path data/upload \
            --vus "$CONCURRENT_UPLOADS" \
            --think-time "$THINK_TIME_SECONDS" \
            --duration "$DURATION" \
            --iterations "${ITERATIONS:-0}" \
            --photo-ratio "$PHOTO_RATIO"
          mkdir -p results
          df -h > results/df-before.txt
      - name: Start Immich and monitoring
        run: docker compose up -d
      - name: Wait for Immich
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:2283/api/server/ping && exit 0
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Collect failure diagnostics
        if: ${{ failure() }}
        run: |
          docker compose ps
          docker compose logs --no-color database immich-server redis
      - name: Wait for client completion
        run: |
          python3 scripts/done_listener.py --port "$SIGNAL_PORT" --output client-complete.signal &
          listener_pid=$!
          trap 'kill "$listener_pid" 2>/dev/null || true' EXIT
          timeout --foreground 2700 bash -c \
            'until test -f client-complete.signal; do sleep 2; done'
      - name: Collect server results
        if: always()
        run: |
          mkdir -p results
          df -h > results/df-after.txt
          bash ./scripts/collect-results.sh "${{ github.workspace }}/results"
      - name: Upload server results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: immich-load_run=${{ github.run_id }}_role=server_${{ env.RUN_PARAMS }}
          path: results
          if-no-files-found: warn
      - name: Clean up stack
        if: always()
        run: docker compose down -v

  client:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: loadtest
    env:
      SERVER_NAME: immich-server-${{ github.run_id }}
      SIGNAL_PORT: "5000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record run parameters
        run: python3 scripts/record_run_params.py --role client --output data/results/run-params.json
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: immich-client-${{ github.run_id }}
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Resolve server endpoint
        run: |
          for attempt in $(seq 1 30); do
            tailscale status --json > tailscale-status.json
            if server_ip="$(python3 scripts/find_peer_ip.py tailscale-status.json "$SERVER_NAME" 2>/dev/null)"; then
              if tailscale ping --timeout=5s "$server_ip" >/dev/null 2>&1; then
                echo "IMMICH_URL=http://${server_ip}:2283" >> "$GITHUB_ENV"
                echo "SERVER_IP=${server_ip}" >> "$GITHUB_ENV"
                echo "K6_PROMETHEUS_RW_SERVER_URL=http://${server_ip}:9090/api/v1/write" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            server_ip="$(getent ahostsv4 "$SERVER_NAME" | awk 'NR == 1 {print $1}')"
            if [ -n "$server_ip" ] && tailscale ping --timeout=5s "$server_ip" >/dev/null 2>&1; then
              echo "IMMICH_URL=http://${server_ip}:2283" >> "$GITHUB_ENV"
              echo "SERVER_IP=${server_ip}" >> "$GITHUB_ENV"
              echo "K6_PROMETHEUS_RW_SERVER_URL=http://${server_ip}:9090/api/v1/write" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          tailscale status
          exit 1
      - name: Wait for remote Immich
        timeout-minutes: 30
        run: |
          for attempt in $(seq 1 360); do
            if curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              "${IMMICH_URL}/api/server/ping"; then
              exit 0
            fi
            sleep 5
          done
          echo "Immich did not become ready at ${IMMICH_URL}" >&2
          exit 1
      - name: Run k6
        env:
          DURATION: ${{ inputs.duration || '30s' }}
          CONCURRENT_UPLOADS: ${{ inputs.concurrent_uploads || '1' }}
          USERS: ${{ inputs.users || '1' }}
          THINK_TIME_SECONDS: ${{ inputs.think_time_seconds || '0' }}
          PHOTO_RATIO: ${{ inputs.photo_ratio || '0.5' }}
          SIZE_LEVEL: ${{ inputs.size_level || 'small' }}
          RESOLUTION: ${{ inputs.resolution || '1080p' }}
          ITERATIONS: ${{ inputs.iterations }}
          FIXTURE_SEED: ${{ inputs.fixture_seed || '533' }}
          DRAIN_TIMEOUT_SECONDS: ${{ inputs.drain_timeout_seconds || '1800' }}
          RESULTS_DIR: ${{ github.workspace }}/data/results
        run: bash ./scripts/run-load-test.sh
      - name: Signal server
        if: always()
        run: |
          if [ -n "${SERVER_IP:-}" ]; then
            curl --fail --silent --show-error --max-time 10 \
              --data-binary done "http://${SERVER_IP}:${SIGNAL_PORT}/done" || true
          fi
      - name: Upload client results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: immich-load_run=${{ github.run_id }}_role=client_${{ env.RUN_PARAMS }}
          path: data/results
          if-no-files-found: warn
