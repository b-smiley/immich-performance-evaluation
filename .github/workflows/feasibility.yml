name: Tailscale runner feasibility

on:
  workflow_call:
    inputs:
      attempts:
        description: Number of fresh runner pairs to test
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  server:
    name: Server attempt ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: loadtest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.attempts || '1') == '1' && '[{"attempt":1}]' || (inputs.attempts || '1') == '2' && '[{"attempt":1},{"attempt":2}]' || (inputs.attempts || '1') == '3' && '[{"attempt":1},{"attempt":2},{"attempt":3}]' || (inputs.attempts || '1') == '4' && '[{"attempt":1},{"attempt":2},{"attempt":3},{"attempt":4}]' || '[{"attempt":1},{"attempt":2},{"attempt":3},{"attempt":4},{"attempt":5}]') }}
    env:
      SERVER_NAME: srv-${{ github.run_id }}-${{ matrix.attempt }}
      DONE_PORT: "5000"
    steps:
      - name: Check out helpers
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Join Tailscale
        timeout-minutes: 5
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: ${{ env.SERVER_NAME }}

      - name: Install network tools
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes iperf3 sysstat

      - name: Collect server netcheck
        timeout-minutes: 2
        run: |
          tailscale netcheck --format=json > server-netcheck.json
          tailscale status --json > server-tailscale-status.json

      - name: Run iperf3 and wait for client
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/done_listener.py --port "$DONE_PORT" --output done.signal &
          listener_pid=$!
          iperf3 --server > iperf3-server.log 2>&1 &
          iperf_pid=$!
          tailscaled_pid="$(pidof tailscaled | awk '{print $1}')"
          pidstat -u -p "$tailscaled_pid,$iperf_pid" 1 600 > server-cpu.log &
          pidstat_pid=$!
          cleanup() {
            kill "$pidstat_pid" "$iperf_pid" "$listener_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          timeout --foreground 600 bash -c \
            'until test -f done.signal; do sleep 2; done'

      - name: Upload server results
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-${{ matrix.attempt }}-server
          path: |
            server-netcheck.json
            server-tailscale-status.json
            server-cpu.log
            iperf3-server.log
            done.signal
          if-no-files-found: warn

  client:
    name: Client attempt ${{ matrix.attempt }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: loadtest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.attempts || '1') == '1' && '[{"attempt":1}]' || (inputs.attempts || '1') == '2' && '[{"attempt":1},{"attempt":2}]' || (inputs.attempts || '1') == '3' && '[{"attempt":1},{"attempt":2},{"attempt":3}]' || (inputs.attempts || '1') == '4' && '[{"attempt":1},{"attempt":2},{"attempt":3},{"attempt":4}]' || '[{"attempt":1},{"attempt":2},{"attempt":3},{"attempt":4},{"attempt":5}]') }}
    env:
      SERVER_NAME: srv-${{ github.run_id }}-${{ matrix.attempt }}
      CLIENT_NAME: cli-${{ github.run_id }}-${{ matrix.attempt }}
      DONE_PORT: "5000"
    steps:
      - name: Check out helpers
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Join Tailscale
        timeout-minutes: 5
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: ${{ env.CLIENT_NAME }}

      - name: Install iperf3
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes iperf3

      - name: Wait for server
        timeout-minutes: 4
        run: |
          for attempt in $(seq 1 24); do
            tailscale status --json > tailscale-status-before-wait.json
            if SERVER_IP="$(python3 scripts/find_peer_ip.py tailscale-status-before-wait.json "$SERVER_NAME" 2>>server-tailscale-ping-wait.log)"; then
              if tailscale ping --timeout=5s "$SERVER_IP" >> server-tailscale-ping-wait.log 2>&1; then
                printf '%s\n' "$SERVER_IP" > server-ip.txt
                exit 0
              fi
            else
              printf 'server peer not visible on attempt %s\n' "$attempt" >> server-tailscale-ping-wait.log
            fi
            if tailscale ping --timeout=5s "$SERVER_NAME" >> server-tailscale-ping-wait.log 2>&1; then
              SERVER_IP="$(getent ahostsv4 "$SERVER_NAME" | awk 'NR == 1 {print $1}')"
              if [ -n "$SERVER_IP" ]; then
                printf '%s\n' "$SERVER_IP" > server-ip.txt
                exit 0
              fi
            fi
            sleep 5
          done
          tailscale status
          cat server-tailscale-ping-wait.log
          exit 1

      - name: Collect client network diagnostics
        timeout-minutes: 4
        run: |
          tailscale netcheck --format=json > client-netcheck.json
          tailscale ping -c 10 "$(cat server-ip.txt)" > tailscale-ping.log 2>&1
          tailscale status --json > tailscale-status.json
          ping -c 20 "$(cat server-ip.txt)" > plain-ping.log 2>&1

      - name: Run iperf3 measurements
        timeout-minutes: 5
        run: |
          server_ip="$(cat server-ip.txt)"
          iperf3 --client "$server_ip" --time 30 --json > iperf3-single.json
          iperf3 --client "$server_ip" --time 30 --parallel 4 --json > iperf3-parallel.json
          iperf3 --client "$server_ip" --time 30 --reverse --json > iperf3-reverse.json

      - name: Signal completion
        timeout-minutes: 2
        run: |
          curl --fail --silent --show-error --max-time 10 \
            --data-binary done \
            "http://$(cat server-ip.txt):$DONE_PORT/done"

      - name: Upload client results
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-${{ matrix.attempt }}-client
          path: |
            client-netcheck.json
            tailscale-ping.log
            server-tailscale-ping-wait.log
            tailscale-status-before-wait.json
            tailscale-status.json
            server-ip.txt
            plain-ping.log
            iperf3-single.json
            iperf3-parallel.json
            iperf3-reverse.json
          if-no-files-found: warn

  summary:
    name: Summarize results
    if: ${{ always() }}
    needs: [server, client]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out parser
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download results
        timeout-minutes: 5
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: results-*
          path: results

      - name: Write summary
        timeout-minutes: 2
        env:
          ATTEMPTS: ${{ inputs.attempts || '1' }}
        run: python3 scripts/summarize_feasibility.py results "$ATTEMPTS" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when a runner pair did not complete
        if: ${{ needs.server.result != 'success' || needs.client.result != 'success' }}
        run: |
          echo "Feasibility failed: server=${{ needs.server.result }}, client=${{ needs.client.result }}" >&2
          exit 1
